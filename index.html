<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Model Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: rgba(255,255,255,0.07);
      --text: #e8e4dc;
      --muted: rgba(232,228,220,0.4);
      --accent: #c8f542;
      --accent-dim: rgba(200,245,66,0.12);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ── Top bar ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(13,13,13,0.95) 60%, transparent);
    }

    .logo {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.75); }
    }

    /* ── Model viewer ── */
    model-viewer {
      width: 100vw;
      height: 100dvh;
      background-color: var(--bg);
      --poster-color: var(--bg);
    }

    /* ── Loading overlay ── */
    .loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-ring {
      width: 48px; height: 48px;
      border: 1.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Bottom panel ── */
    .bottom-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      padding: 0 20px 36px;
      background: linear-gradient(to top, rgba(13,13,13,0.97) 60%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* ── AR button ── */
    #ar-button {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      padding: 15px 32px;
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      width: 100%;
      max-width: 360px;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 0 28px rgba(200,245,66,0.2);
    }

    #ar-button:active {
      transform: scale(0.97);
    }

    #ar-button svg {
      width: 18px; height: 18px;
      flex-shrink: 0;
    }

    /* hide button if AR not available */
    #ar-button[hidden] { display: none; }

    /* ── Hint text ── */
    .hint {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      text-align: center;
    }

    /* ── Instructions card (shown before AR launch) ── */
    .instructions {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px 18px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .instructions-title {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .instructions ol {
      list-style: none;
      counter-reset: steps;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .instructions li {
      counter-increment: steps;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .instructions li::before {
      content: counter(steps, decimal-leading-zero);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div class="loader" id="loader">
    <div class="loader-ring"></div>
    <span class="loader-text">Loading model</span>
  </div>

  <!-- Top bar -->
  <header>
    <span class="logo">AR Viewer</span>
    <div class="status-dot"></div>
  </header>

  <!-- Model Viewer -->
  <!--
    ⚠️  EDIT THESE TWO LINES:
        src        → your .glb filename  (e.g. src="pavilion.glb")
        ios-src    → your .usdz filename (e.g. ios-src="pavilion.usdz")
  -->
  <model-viewer
    id="viewer"
    src="your-model.glb"
    ios-src="your-model.usdz"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-controls
    auto-rotate
    auto-rotate-delay="1000"
    rotation-per-second="20deg"
    shadow-intensity="1.2"
    shadow-softness="0.8"
    environment-image="neutral"
    exposure="0.9">

    <!-- AR button slot — rendered inside model-viewer -->
    <button slot="ar-button" id="ar-button">
      <!-- camera icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Place in your space
    </button>

  </model-viewer>

  <!-- Bottom panel -->
  <div class="bottom-panel">
    <div class="instructions">
      <span class="instructions-title">How to use</span>
      <ol>
        <li>Rotate and preview the model above</li>
        <li>Tap the button below to open your camera</li>
        <li>Slowly move your phone to detect a flat surface</li>
        <li>Tap where you want to place the model</li>
      </ol>
    </div>
    <span class="hint">Works on iOS &amp; Android — no app needed</span>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const loader = document.getElementById('loader');

    // Hide loader once model is ready
    viewer.addEventListener('load', () => {
      loader.classList.add('hidden');
    });

    // Fallback: hide loader after 6s even if event doesn't fire
    setTimeout(() => loader.classList.add('hidden'), 6000);
  </script>

</body>
</html>
